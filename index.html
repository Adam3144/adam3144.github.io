<!DOCTYPE html>

<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Adam Ali</title>

    <link rel="icon" type="image/png" href="icon.png">

    <!-- Open Graph (SOCIAL PREVIEW) -->
    <meta property="og:title" content="Adam Ali">
    <meta property="og:description" content="View my latest game releases and more!">
    <meta property="og:image" content="https://adam3144.github.io/preview.png">
    <meta property="og:url" content="https://adam3144.github.io/">
    <meta property="og:type" content="website">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #unity-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        background: #000;
      }

      /* Loading screen */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        color: white;
        font-size: 32px;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      /* Rotate device overlay */
      #rotate-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        color: white;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 10000;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      #rotate-overlay img {
        width: 100px;
        margin-bottom: 20px;
        animation: rotateAnim 1.5s infinite alternate ease-in-out;
      }

      @keyframes rotateAnim {
        from { transform: rotate(0deg); }
        to { transform: rotate(90deg); }
      }
    </style>
  </head>

  <body>
    <!-- Loading screen -->
    <div id="loading-screen">Loading... 0%</div>

    <!-- Rotate overlay -->
    <div id="rotate-overlay">
      <img src="https://cdn-icons-png.flaticon.com/512/60/60736.png" alt="Rotate device">
      <div>Please rotate your device</div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script src="Build/Builds.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingScreen = document.getElementById("loading-screen");
      var rotateOverlay = document.getElementById("rotate-overlay");

      var config = {
        arguments: [],
        dataUrl: "Build/Builds.data",
        frameworkUrl: "Build/Builds.framework.js",
        codeUrl: "Build/Builds.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Website Test",
        productVersion: "1.0",
      };

      // Detect mobile
      function isMobile() {
        return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      }

      // Check orientation
      function checkOrientation() {
        if (isMobile()) {
          if (window.innerHeight > window.innerWidth) {
            rotateOverlay.style.display = "flex"; // portrait
          } else {
            rotateOverlay.style.display = "none"; // landscape
          }
        } else {
          rotateOverlay.style.display = "none";
        }
      }

      // Run on load + changes
      checkOrientation();
      window.addEventListener("resize", checkOrientation);
      window.addEventListener("orientationchange", checkOrientation);

      // Mobile fullscreen fix
      if (isMobile()) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no';
        document.head.appendChild(meta);
      }

      createUnityInstance(canvas, config, (progress) => {
        loadingScreen.innerText = "Loading... " + Math.round(progress * 100) + "%";
      }).then((unityInstance) => {
        loadingScreen.style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
