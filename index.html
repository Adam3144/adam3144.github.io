<style>

html,body{
margin:0;
padding:0;
background:black;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial;
}

#unity-canvas{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:black;
}

/* LOADING */
#loading-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

#loader{
width:420px;
}

#progress-container{
display:flex;
align-items:center;
gap:15px;
}

#progress-bg{
flex:1;
height:18px;
background:#111;
border-radius:20px;
overflow:hidden;
border:1px solid #333;
box-shadow:0 0 20px rgba(0,255,255,.15) inset;
}

#progress-bar{
height:100%;
width:0%;
border-radius:20px;
background:linear-gradient(90deg,#00ffff,#0088ff,#00ffff);
background-size:200% 100%;
animation:glowMove 2s linear infinite;
box-shadow:0 0 10px #00ffff,0 0 25px #0088ff;
transition:width .25s ease;
}

#progress-text{
font-size:18px;
color:#7fe7ff;
min-width:45px;
text-align:right;
}

/* ANIMATION */
@keyframes glowMove{
0%{background-position:0%}
100%{background-position:200%}
}

/* ROTATE OVERLAY (MOBILE) */
#rotate-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.92);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
color:#7fe7ff;
z-index:9000;
gap:20px;
}

.phone{
width:60px;
height:100px;
border-radius:15px;
background:linear-gradient(120deg,rgba(0,255,255,0.12),rgba(0,136,255,0.12));
border:2px solid rgba(0,255,255,0.6);
box-shadow:
0 0 12px #00ffff,
0 0 30px #0088ff;
animation:rotateAnim 1.2s infinite alternate;
position:relative;
}

.phone::before{
content:"";
position:absolute;
top:50%;
left:50%;
width:140px;
height:140px;
transform:translate(-50%,-50%);
border-radius:50%;
background:conic-gradient(from 0deg,
rgba(0,255,255,0),
rgba(0,255,255,0.8),
rgba(0,136,255,0.8),
rgba(0,255,255,0));
filter:blur(12px);
animation:auraSpin 2.5s linear infinite;
z-index:-1;
}

@keyframes rotateAnim{
from{transform:rotate(0deg);}
to{transform:rotate(90deg);}
}

@keyframes auraSpin{
from{transform:translate(-50%,-50%) rotate(0deg);}
to{transform:translate(-50%,-50%) rotate(360deg);}
}

/* IGNORE BUTTON */
#ignore-rotate{
padding:10px 18px;
border-radius:8px;
border:1px solid #00ffff;
background:rgba(0,255,255,0.1);
color:#7fe7ff;
cursor:pointer;
font-size:14px;
transition:all 0.2s ease;
}

#ignore-rotate:hover{
background:rgba(0,255,255,0.25);
}

/* CLICK OVERLAY (DESKTOP) */
#click-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.92);
display:none;
justify-content:center;
align-items:center;
z-index:9000;
}

.click-text{
font-size:80px;
font-weight:bold;
color:#7fe7ff;
letter-spacing:5px;
text-shadow:
0 0 10px #00ffff,
0 0 30px #0088ff,
0 0 60px #00ffff;
position:relative;
animation:pulseGlow 1.5s ease-in-out infinite alternate;
}

.click-text::before{
content:"";
position:absolute;
top:50%;
left:50%;
width:250px;
height:250px;
transform:translate(-50%,-50%);
border-radius:50%;
background:conic-gradient(from 0deg,
rgba(0,255,255,0),
rgba(0,255,255,0.8),
rgba(0,136,255,0.8),
rgba(0,255,255,0));
filter:blur(25px);
animation:auraSpin 3s linear infinite;
z-index:-1;
}

@keyframes pulseGlow{
from{transform:scale(1);opacity:0.8;}
to{transform:scale(1.1);opacity:1;}
}

</style>
</head>

<body>

<div id="loading-screen">
<div id="loader">
<div id="progress-container">
<div id="progress-bg">
<div id="progress-bar"></div>
</div>
<div id="progress-text">0%</div>
</div>
</div>
</div>

<div id="rotate-overlay">
<div class="phone"></div>
<div>Please rotate your device</div>
<button id="ignore-rotate">Tap to ignore (not recommended)</button>
</div>

<!-- NEW CLICK OVERLAY -->
<div id="click-overlay">
<div class="click-text">CLICK!</div>
</div>

<canvas id="unity-canvas"></canvas>

<script src="Build/Builds.loader.js"></script>

<script>

var canvas=document.querySelector("#unity-canvas");
var loadingScreen=document.getElementById("loading-screen");
var rotateOverlay=document.getElementById("rotate-overlay");
var clickOverlay=document.getElementById("click-overlay");

var progressBar=document.getElementById("progress-bar");
var progressText=document.getElementById("progress-text");

var ignoreButton=document.getElementById("ignore-rotate");

var unityInstance;
var isLoaded=false;
var audioUnlocked=false;
var ignoreRotation=false;

function isMobile(){
return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
}

function checkOrientation(){
if(!isLoaded || ignoreRotation) return;

if(isMobile()){
if(window.innerHeight>window.innerWidth)
rotateOverlay.style.display="flex";
else
rotateOverlay.style.display="none";
}else{
rotateOverlay.style.display="none";
}
}

window.addEventListener("resize",checkOrientation);
window.addEventListener("orientationchange",checkOrientation);

/* IGNORE BUTTON LOGIC */
ignoreButton.addEventListener("click",function(){
ignoreRotation=true;
rotateOverlay.style.display="none";
});

if(isMobile()){
var meta=document.createElement('meta');
meta.name='viewport';
meta.content='width=device-width,height=device-height,initial-scale=1,user-scalable=no';
document.head.appendChild(meta);
}

createUnityInstance(canvas,{
dataUrl:"Build/Builds.data",
frameworkUrl:"Build/Builds.framework.js",
codeUrl:"Build/Builds.wasm",
streamingAssetsUrl:"StreamingAssets"
},(progress)=>{

var percent=Math.round(progress*100);
progressBar.style.width=percent+"%";
progressText.innerText=percent+"%";

})
.then((instance)=>{

unityInstance=instance;
loadingScreen.style.display="none";
isLoaded=true;

checkOrientation();

/* SHOW CLICK SCREEN ON DESKTOP */
if(!isMobile()){
clickOverlay.style.display="flex";
}

/* FIRST CLICK UNLOCKS AUDIO */
window.addEventListener("pointerdown",function(){

try{
unityInstance.SendMessage("AudioPeer","EnableAudio");
}catch(e){}

audioUnlocked=true;
clickOverlay.style.display="none";

},{once:true});

})
.catch((message)=>{
alert(message);
});

</script>

</body>
</html>
