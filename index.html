<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Adam Ali</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GD02FPB43"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9GD02FPB43');

      // Unity custom event tracker
      function trackEvent(eventName) {
        gtag('event', eventName);
      }
    </script>

    <link rel="icon" type="image/png" href="icon.png">

    <!-- Open Graph -->
    <meta property="og:title" content="Adam Ali">
    <meta property="og:description" content="View my latest game releases and more!">
    <meta property="og:image" content="https://adam3144.github.io/preview.png">
    <meta property="og:url" content="https://adam3144.github.io/">
    <meta property="og:type" content="website">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #unity-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        background: #000;
      }

      /* Loading screen */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        color: white;
        font-size: 32px;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      /* Rotate overlay */
      #rotate-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.9);
        color: white;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 9000;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      /* CSS phone icon */
      .phone {
        width: 60px;
        height: 100px;
        border: 4px solid white;
        border-radius: 15px;
        position: relative;
        margin-bottom: 20px;
        animation: rotateAnim 1.2s infinite alternate ease-in-out;
      }

      .phone::after {
        content: "";
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        width: 10px;
        height: 10px;
        background: white;
        border-radius: 50%;
      }

      @keyframes rotateAnim {
        from { transform: rotate(0deg); }
        to { transform: rotate(90deg); }
      }
    </style>
  </head>

  <body>
    <!-- Loading screen -->
    <div id="loading-screen">Loading... 0%</div>

    <!-- Rotate overlay -->
    <div id="rotate-overlay">
      <div class="phone"></div>
      <div>Please rotate your device</div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script src="Build/Builds.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingScreen = document.getElementById("loading-screen");
      var rotateOverlay = document.getElementById("rotate-overlay");

      var isLoaded = false;

      var config = {
        arguments: [],
        dataUrl: "Build/Builds.data",
        frameworkUrl: "Build/Builds.framework.js",
        codeUrl: "Build/Builds.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Website Test",
        productVersion: "1.0",
      };

      function isMobile() {
        return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      }

      function checkOrientation() {
        if (!isLoaded) return;

        if (isMobile()) {
          if (window.innerHeight > window.innerWidth) {
            rotateOverlay.style.display = "flex"; // portrait
          } else {
            rotateOverlay.style.display = "none"; // landscape
          }
        } else {
          rotateOverlay.style.display = "none";
        }
      }

      window.addEventListener("resize", checkOrientation);
      window.addEventListener("orientationchange", checkOrientation);

      // Mobile viewport fix
      if (isMobile()) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no';
        document.head.appendChild(meta);
      }

      createUnityInstance(canvas, config, (progress) => {
        loadingScreen.innerText = "Loading... " + Math.round(progress * 100) + "%";
      }).then((unityInstance) => {
        loadingScreen.style.display = "none";
        isLoaded = true;
        checkOrientation();

        // Optional: track Unity page load event
        if (typeof gtag !== "undefined") {
          gtag('event', 'unity_page_loaded');
        }
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
