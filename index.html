<style>

html,body{

margin:0;
padding:0;

background:black;

width:100%;
height:100%;

overflow:hidden;

font-family:Arial;

}

#unity-canvas{

position:fixed;

top:0;
left:0;

width:100vw;
height:100vh;

background:black;

}

#loading-screen{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:black;

display:flex;

justify-content:center;
align-items:center;

z-index:9999;

}

#loader{

width:420px;

}

/* progress layout */

#progress-container{

display:flex;

align-items:center;

gap:15px;

}

#progress-bg{

flex:1;

height:18px;

background:#111;

border-radius:20px;

overflow:hidden;

border:1px solid #333;

box-shadow:
0 0 20px rgba(0,255,255,.15) inset;

position:relative;

}

/* existing glow bar */

#progress-bar{

height:100%;

width:0%;

border-radius:20px;

background:linear-gradient(
90deg,
#00ffff,
#0088ff,
#00ffff
);

background-size:200% 100%;

animation:glowMove 2s linear infinite;

box-shadow:
0 0 10px #00ffff,
0 0 25px #0088ff;

transition:width .25s ease;

position:relative;

}

/* NEW holographic sideways scan line */

#progress-bar::after{

content:"";

position:absolute;

top:0;

left:-30%;

width:30%;

height:100%;

background:linear-gradient(

90deg,

transparent,

rgba(255,255,255,.45),

rgba(0,255,255,.4),

transparent

);

animation:holoSweep 2.2s linear infinite;

}

/* subtle scanline texture */

#progress-bg::after{

content:"";

position:absolute;

width:100%;
height:100%;

background:

repeating-linear-gradient(

to bottom,

rgba(0,255,255,.05) 0px,
rgba(0,255,255,.05) 2px,
transparent 2px,
transparent 4px

);

pointer-events:none;

}

/* percent text */

#progress-text{

font-size:18px;

color:#7fe7ff;

min-width:45px;

text-align:right;

letter-spacing:1px;

}

/* animations */

@keyframes glowMove{

0%{background-position:0%}

100%{background-position:200%}

}

@keyframes holoSweep{

0%{

left:-30%;

}

100%{

left:130%;

}

}

#rotate-overlay{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.9);

display:none;

justify-content:center;
align-items:center;

flex-direction:column;

color:white;

z-index:9000;

}

.phone{

width:60px;
height:100px;

border:4px solid white;

border-radius:15px;

margin-bottom:20px;

animation:rotateAnim 1.2s infinite alternate;

}

.phone::after{

content:"";

position:absolute;

bottom:6px;

left:50%;

transform:translateX(-50%);

width:10px;
height:10px;

background:white;

border-radius:50%;

}

@keyframes rotateAnim{

from{transform:rotate(0deg);}

to{transform:rotate(90deg);}

}

</style>

</head>

<body>

<div id="loading-screen">

<div id="loader">

<div id="progress-container">

<div id="progress-bg">

<div id="progress-bar"></div>

</div>

<div id="progress-text">

0%

</div>

</div>

</div>

</div>

<div id="rotate-overlay">

<div class="phone"></div>

<div>Please rotate your device</div>

</div>

<canvas id="unity-canvas"></canvas>

<script src="Build/Builds.loader.js"></script>

<script>

var canvas=
document.querySelector("#unity-canvas");

var loadingScreen=
document.getElementById("loading-screen");

var rotateOverlay=
document.getElementById("rotate-overlay");

var progressBar=
document.getElementById("progress-bar");

var progressText=
document.getElementById("progress-text");

var unityInstance;

var isLoaded=false;

var config={

arguments:[],

dataUrl:"Build/Builds.data",

frameworkUrl:"Build/Builds.framework.js",

codeUrl:"Build/Builds.wasm",

streamingAssetsUrl:"StreamingAssets",

companyName:"DefaultCompany",

productName:"Website Test",

productVersion:"1.0",

};

function isMobile(){

return /iPhone|iPad|iPod|Android/i
.test(navigator.userAgent);

}

function checkOrientation(){

if(!isLoaded)
return;

if(isMobile()){

if(window.innerHeight>
window.innerWidth)

rotateOverlay.style.display="flex";

else

rotateOverlay.style.display="none";

}

else

rotateOverlay.style.display="none";

}

window.addEventListener("resize",checkOrientation);

window.addEventListener("orientationchange",checkOrientation);

if(isMobile()){

var meta=document.createElement('meta');

meta.name='viewport';

meta.content='width=device-width,height=device-height,initial-scale=1,user-scalable=no';

document.head.appendChild(meta);

}

createUnityInstance(

canvas,
config,

(progress)=>{

var percent=
Math.round(progress*100);

progressBar.style.width=
percent+"%";

progressText.innerText=
percent+"%";

})

.then((instance)=>{

unityInstance=instance;

loadingScreen.style.display="none";

isLoaded=true;

checkOrientation();

setTimeout(()=>{

try{

unityInstance.SendMessage(
"AudioPeer",
"EnableAudio"
);

}catch(e){}

},500);

window.addEventListener(

"pointerdown",

function(){

try{

unityInstance.SendMessage(
"AudioPeer",
"EnableAudio"
);

}catch(e){}

},

{once:true}

);

if(typeof gtag!=="undefined")

gtag(
'event',
'unity_page_loaded'
);

})

.catch((message)=>{

alert(message);

});

</script>

</body>

</html>
